name: Notify Website of Stable Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify-website:
    name: Dispatch Release Event to Website Repo
    # Only notify for published stable releases (ignore drafts and pre-releases)
    if: github.repository == 'vasanthgajavelly5-sys/Lirune' && !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-latest

    steps:
      - name: Verify Secret & Dispatch Event
        env:
          DISPATCH_TOKEN: ${{ secrets.LIRUNE_WEBSITE_DISPATCH_TOKEN }}
          TARGET_REPO: ${{ vars.LIRUNE_WEBSITE_REPO || 'vasanthgajavelly5-sys/Lirune-Website' }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning title=Missing Secret::LIRUNE_WEBSITE_DISPATCH_TOKEN secret is not configured in this repository. Website release update notification was skipped."
            echo "To enable automated website updates on release publication:"
            echo "1. Create a fine-grained Personal Access Token with 'Contents: Read and write' on the website repository ($TARGET_REPO)."
            echo "2. Add it as an Actions Secret named LIRUNE_WEBSITE_DISPATCH_TOKEN in this application repository."
            exit 0
          fi

          echo "Dispatching 'lirune-release-published' event to $TARGET_REPO for release $RELEASE_TAG..."
          
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPO}/dispatches" \
            -d "{\"event_type\":\"lirune-release-published\",\"client_payload\":{\"release_tag\":\"${RELEASE_TAG}\",\"release_id\":${RELEASE_ID},\"release_url\":\"${RELEASE_URL}\",\"repository\":\"${GITHUB_REPOSITORY}\"}}")

          if [ "$HTTP_STATUS" -eq 204 ]; then
            echo "Successfully dispatched release event to $TARGET_REPO."
          else
            echo "::error title=Dispatch Failed::Failed to send repository_dispatch event to $TARGET_REPO (HTTP $HTTP_STATUS)."
            cat response.txt
            exit 1
          fi
