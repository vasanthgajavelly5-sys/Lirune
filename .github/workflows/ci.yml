name: Security, Lint & CI Gate

on:
  push:
    branches: [ lirune-store-home, main, master, android ]
  pull_request:
    branches: [ lirune-store-home, main, master, android ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-desktop:
    name: Desktop Validation (Node 22 / Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    if: github.ref_name != 'android'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Lint and syntax checks
        run: npm run lint

      - name: Modernization and deprecated API gate
        run: npm run check:modernization

      - name: Desktop test suite
        run: npm test

      - name: Production dependency security audit
        run: node scripts/audit-prod.js

      - name: Upload E2E failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test/e2e/screenshots/
          if-no-files-found: ignore

      - name: Validate corpus (if available)
        run: npm run validate:corpus

      - name: Release configuration validation
        run: npm run validate:release:config

      - name: Windows packaging assembly check (unsigned directory)
        run: npm run pack

  validate-mobile:
    name: Mobile Validation (Node 22 / Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref_name != 'lirune-store-home'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Clean install mobile dependencies
        run: npm --prefix mobile ci

      - name: Generate PDF.js assets
        run: npm --prefix mobile run gen:pdfjs

      - name: Mobile linting
        run: npm --prefix mobile run lint

      - name: Modernization and deprecated API gate
        run: npm run check:modernization

      - name: Mobile TypeScript check
        run: npm --prefix mobile run typecheck

      - name: Verify PDF.js integrity
        run: npm --prefix mobile run check:pdfjs

      - name: Mobile test suite
        run: npm --prefix mobile test

      - name: Generate Android native project
        working-directory: mobile
        run: npx expo prebuild --no-install --platform android

      - name: Android debug build
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug

      - name: Mobile production dependency audit
        run: npm --prefix mobile audit --omit=dev --audit-level=critical
