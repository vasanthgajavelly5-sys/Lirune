name: Mandatory Release Gate & Validation Pipeline

on:
  workflow_dispatch:
    inputs:
      release_candidate_tag:
        description: 'Release candidate tag (e.g. v5.6.4 or v4.9.3)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (validate without publishing)'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - android

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1, 2, 3: Source, Version, Modernization & Dependency Security Audit
  # ---------------------------------------------------------------------------
  stage-source-and-security:
    name: Stage 1-3 — Source, Modernization & Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean install desktop dependencies
        run: npm ci

      - name: Verify package version consistency
        run: |
          node -e "
            const pkg = require('./package.json');
            const mobPkg = require('./mobile/package.json');
            console.log('Desktop version:', pkg.version);
            console.log('Mobile version:', mobPkg.version);
            if (!pkg.version || !mobPkg.version) {
              console.error('Missing package version in root or mobile');
              process.exit(1);
            }
          "

      - name: Run ESLint & Syntax Validation
        run: npm run lint

      - name: Modernization & Deprecated API Release Gate
        run: npm run check:modernization

      - name: Desktop Production Dependency Security Audit
        run: node scripts/audit-prod.js

      - name: Clean install mobile dependencies
        run: npm --prefix mobile ci

      - name: Mobile ESLint Validation
        run: npm --prefix mobile run lint

      - name: Mobile TypeScript Strict Check
        run: npm --prefix mobile run typecheck

      - name: Verify PDF.js Engine Integrity
        run: npm --prefix mobile run check:pdfjs

      - name: Mobile Production Dependency Security Audit
        run: npm --prefix mobile audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------
  # STAGE 4, 5, 6, 7, 9, 10, 11: Windows Desktop Pipeline
  # ---------------------------------------------------------------------------
  stage-windows-desktop:
    name: Stage 4-7, 9-11 — Windows Tests, Build, BAT & Install Lifecycle
    runs-on: windows-latest
    timeout-minutes: 35
    needs: [stage-source-and-security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean install desktop dependencies
        run: npm ci

      - name: Run Windows Desktop Test Suite (Unit & Integration)
        run: npm test

      - name: Run Windows Desktop Performance Benchmark
        run: node --test test/perf-benchmark.test.js

      - name: Run Windows Desktop E2E Suite
        run: npm run test:e2e

      - name: Validate Windows BAT Launcher
        run: node --test test/windows-launcher.test.js

      - name: Validate Release Configuration
        run: npm run validate:release:config

      - name: Package Windows Desktop Unpacked Release
        run: npm run pack

      - name: Build Windows NSIS Release Installer
        run: npm run dist:win

      - name: Validate Generated Windows Release Artifacts
        run: node scripts/validate-release.js

      - name: Windows Real Launcher, Install, Upgrade & Uninstallation Lifecycle Test
        shell: pwsh
        run: pwsh scripts/test-real-launcher.ps1

      - name: Upload Windows Release Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-installer
          path: dist/Lirune Reader-*-Setup.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # STAGE 4, 5, 8: Android Mobile Pipeline
  # ---------------------------------------------------------------------------
  stage-android-mobile:
    name: Stage 4-5, 8 — Android Automated Suite & Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [stage-source-and-security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Clean install mobile dependencies
        run: npm --prefix mobile ci

      - name: Generate PDF.js Assets
        run: npm --prefix mobile run gen:pdfjs

      - name: Run Mobile Test Suite (402 Unit & Integration Tests)
        run: npm --prefix mobile test

      - name: Prebuild Native Android Project
        working-directory: mobile
        run: npx expo prebuild --no-install --platform android

      - name: Assemble Android Release APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Emulator E2E & Lifecycle Suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: pwsh ./mobile/scripts/test_android_e2e_lifecycle.ps1

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # STAGE 12: Mandatory Release Acceptance Gate
  # ---------------------------------------------------------------------------
  release-acceptance-gate:
    name: Stage 12 — Mandatory Release Acceptance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [stage-source-and-security, stage-windows-desktop, stage-android-mobile]
    if: success()
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: final-release-dist/

      - name: Compute SHA-256 Checksums for Release Candidates
        run: |
          mkdir -p release-bundle
          find final-release-dist/ -type f \( -name "*.exe" -o -name "*.apk" \) -exec cp {} release-bundle/ \;
          cd release-bundle
          sha256sum * > SHA256SUMS.txt
          echo "============================================="
          echo "RELEASE CANDIDATE SHA-256 CHECKSUMS:"
          echo "============================================="
          cat SHA256SUMS.txt
          echo "============================================="

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: 'release-bundle/*'
        continue-on-error: true

      - name: Final Release Acceptance Status
        run: |
          echo "MANDATORY RELEASE GATE: ALL STAGES PASSED."
          echo "Both Android and Windows validated successfully."
          echo "Ready for authorized distribution."
