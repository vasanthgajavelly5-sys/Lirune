appId: com.lirune.reader
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "18 books in library"
    timeout: 120000
- scrollUntilVisible:
    element:
      text: "Python Docx Test (docx)"
    direction: DOWN
    timeout: 30000
- tapOn: "Python Docx Test (docx)"
- waitForAnimationToEnd:
    timeout: 10000
