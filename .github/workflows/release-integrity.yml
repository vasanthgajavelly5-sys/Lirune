name: Release Integrity & Checksums

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v4.9.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  checksums-and-attest:
    name: Generate Release Checksums & Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            let release = context.payload.release;
            if (!release && context.payload.inputs && context.payload.inputs.tag_name) {
              try {
                const rel = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: context.payload.inputs.tag_name
                });
                release = rel.data;
              } catch (e) {
                console.log(`Failed to fetch release for tag ${context.payload.inputs.tag_name}:`, e.message);
              }
            }
            const release_id = release ? release.id : null;
            if (!release_id) {
              console.log('No release context or tag found; skipping download.');
              return;
            }
            const assets = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release_id
            });
            fs.mkdirSync('./release-dist', { recursive: true });
            for (const asset of assets.data) {
              if (asset.name.endsWith('.exe') || asset.name.endsWith('.apk') || asset.name.endsWith('.zip')) {
                console.log(`Downloading ${asset.name}...`);
                const download = await github.rest.repos.getReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                  headers: { accept: 'application/octet-stream' }
                });
                fs.writeFileSync(path.join('./release-dist', asset.name), Buffer.from(download.data));
              }
            }

      - name: Compute SHA-256 Checksums
        run: |
          if [ -d "./release-dist" ] && [ "$(ls -A ./release-dist 2>/dev/null)" ]; then
            cd ./release-dist
            sha256sum * > SHA256SUMS.txt
            cat SHA256SUMS.txt
          else
            echo "No downloaded release assets found to checksum."
          fi

      - name: Attest Artifact Provenance
        if: success()
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-dist/*'
        continue-on-error: true

      - name: Upload SHA256SUMS to Release
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let release = context.payload.release;
            if (!release && context.payload.inputs && context.payload.inputs.tag_name) {
              try {
                const rel = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: context.payload.inputs.tag_name
                });
                release = rel.data;
              } catch (e) {
                console.log(`Failed to fetch release for tag ${context.payload.inputs.tag_name}:`, e.message);
              }
            }
            const release_id = release ? release.id : null;
            if (!release_id || !fs.existsSync('./release-dist/SHA256SUMS.txt')) {
              console.log('No release id or SHA256SUMS.txt found.');
              return;
            }
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release_id,
              name: 'SHA256SUMS.txt',
              data: fs.readFileSync('./release-dist/SHA256SUMS.txt')
            });
        continue-on-error: true
